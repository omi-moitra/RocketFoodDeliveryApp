# ===================================
# TEMPLATE — application.properties
# ===================================
#
# Copy this file to application.properties in this same directory, then fill in
# every value marked CONFIGURE. The real application.properties is gitignored
# because it holds credentials; this template is tracked so the required keys
# stay documented.
#
#   cp TEMPLATEapplication.properties application.properties
#
# ===================================


# ===================================
# DATABASE CONNECTION CONFIGURATION
# ===================================

# MySQL database connection URL - Replace <database_name> with your actual database name
spring.datasource.url = jdbc:mysql://localhost:3306/rdelivery

# CONFIGURE - your MySQL username
spring.datasource.username = your-mysql-username

# CONFIGURE - your MySQL password
spring.datasource.password = your-mysql-password

# MySQL JDBC driver class
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver


# ===================================
# JPA / HIBERNATE CONFIGURATION
# ===================================

# Schema generation strategy:
# - update: Updates the schema if needed (recommended for development)
# - create: Drops and recreates schema on startup (WARNING: loses all data!)
# - create-drop: Creates schema on startup, drops on shutdown
# - validate: Only validates schema, makes no changes (recommended for production)
# - none: No schema management
spring.jpa.hibernate.ddl-auto = update

# Show SQL statements in console (useful for debugging)
spring.jpa.show-sql = true

# Format SQL output for better readability
spring.jpa.properties.hibernate.format_sql = true

# MySQL dialect for Hibernate
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect


# ===================================
# SPRING BOOT DEVTOOLS (AUTO-RESTART)
# ===================================

# Enable automatic restart when classpath files change
spring.devtools.restart.enabled = true

# Additional paths to watch for changes (optional)
spring.devtools.restart.additional-paths = src/main/resources

# Paths to exclude from restart trigger (optional)
# spring.devtools.restart.exclude = static/**,public/**

# Enable LiveReload for browser auto-refresh (optional)
spring.devtools.livereload.enabled = true


# ===================================
# THYMELEAF CONFIGURATION
# ===================================

# Disable Thymeleaf template caching for development
spring.thymeleaf.cache=false


# ===================================
# DATABASE SEEDING
# ===================================

# Uncomment to seed the database upon startup
spring.profiles.active = manual-seeding


# ===================================
# ERROR HANDLING
# ===================================

# Show error details in development
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Don't show error details in development
# server.error.include-message=never
# server.error.include-binding-errors=never
# server.error.include-stacktrace=never
# server.error.include-exception=false

# Custom error path
server.error.path=/error


# ===================================
# JWT CONFIGURATION
# ===================================

# CONFIGURE - secret key for signing JWT tokens.
# Use a long, random, private value; anyone holding it can forge tokens.
# Generate one with: openssl rand -base64 48
app.jwt.secret=your-jwt-signing-secret


# ===================================
# NOTIFICATION CONFIGURATION
# ===================================

# --- Twilio SMS ---
# CONFIGURE: replace with your Twilio credentials
twilio.account-sid=your-twilio-account-sid
twilio.auth-token=your-twilio-auth-token
twilio.from-number=+1XXXXXXXXXX

# --- Email (via Notify.eu REST API) ---

# PERMANENT — do not change (Notify.eu API endpoint)
notify.api-url=https://api.notify.eu/notification/send

# CONFIGURE — replace with your Notify.eu credentials
# Client ID (X-ClientId header)
notify.client-id=your-notify-client-id
# Secret Key (X-SecretKey header)
notify.secret-key=your-notify-secret-key

# CONFIGURE — replace with your template and language settings
# Template Notification Type Name (notificationType in the request body)
notify.template-id=your-template-notification-type-name
# Language code for the notification
notify.language=en


# ===================================
# HOW TO CONFIGURE YOUR SMTP CHANNEL IN NOTIFY.EU
# ===================================
#
# Google (Gmail) have disabled basic password authentication for SMTP.
# You MUST use an App Password instead of your regular
# account password. Here is how to set one up for each provider:
#
# --- GMAIL ---
# 1. Go to your Google Account: https://myaccount.google.com
# 2. Click "Security" in the left menu.
# 3. Under "How you sign in to Google", enable "2-Step Verification" if not already on.
# 4. Once 2-Step Verification is active, search for "App passwords" in the search bar.
# 5. Choose app: "Mail" — Choose device: "Other (custom name)" → type "Notify.eu"
# 6. Google will generate a 16-character App Password (e.g. abcd efgh ijkl mnop).
# 7. In Notify.eu → Edit SMTP channel, use:
#      Server:   smtp.gmail.com
#      Port:     587
#      User:     your-email@gmail.com
#      Password: the 16-character App Password (without spaces)
